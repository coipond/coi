# Named credential bundles. `claude`, `opencode`, `opencode2`, `pi`, `codex`,
# `omp` and `goose` back the builtin Tool implementations' ToolWithConfigDirFiles
# methods (internal/tool), which read these values directly — this catalog is
# the single source of truth, and file seeding for builtin tools and profile
# [[credentials]] entries alike goes through the one session.seedHostFile
# primitive, so there is no second copy of either the values or the mechanics
# to keep in sync. Other entries (e.g. `ollama`) are third-party bundles
# referenced from profile [[credentials]] entries via `bundle = "<name>"`;
# only config_dir, files, and (optionally) mode apply to those —
# sandbox_settings_file/state_file/always_setup/auto_context_file/
# sqlite_wal_files are only meaningful for tools consumed through
# internal/tool's ToolWithConfigDirFiles interface. credential_files names
# the files in files that hold a credential (token, key): the security
# monitor flags a write to them.
#
# sqlite_wal_files names SQLite DBs in WAL mode, each listed in files together
# with its "<db>-wal" (committed writes may still be in the WAL). On resume,
# when the host has the DB, coi removes the saved "<db>-wal" and "<db>-shm"
# before pushing it, so SQLite does not replay a stale WAL over the fresh DB.
#
# api_domains names the hosts the tool's own API and sign-in use. The built-in
# hardened profile (allowlist mode) adds the configured tool's entries to its
# allowed_domains. Tools that talk to a user-chosen provider (opencode, pi,
# omp, goose) have none: add the provider's host to allowed_domains.

[claude]
config_dir = ".claude"
files = [".credentials.json", "config.yml", "settings.json", "CLAUDE.md"]
credential_files = [".credentials.json"]
state_file = ".claude.json"
sandbox_settings_file = "settings.json"
always_setup = false
auto_context_file = ".claude/CLAUDE.md"
# On macOS the OAuth token lives in the login Keychain, not in .credentials.json.
keychain_service = "Claude Code-credentials"
keychain_file = ".credentials.json"
api_domains = ["api.anthropic.com", "platform.claude.com"]

[opencode]
config_dir = ".config/opencode"
files = ["opencode.json", "tui.json"]
sandbox_settings_file = "opencode.json"
always_setup = true

# OpenCode v2 shares v1's config dir. Its TUI config is cli.json (v1's
# tui.json). opencode.jsonc is not copied: v2 loads it after opencode.json, so
# its settings would win over the sandbox settings coi merges there.
[opencode2]
config_dir = ".config/opencode"
files = ["opencode.json", "cli.json"]
sandbox_settings_file = "opencode.json"
always_setup = true

[pi]
config_dir = ".pi/agent"
files = ["settings.json", "models.json", "auth.json", "AGENTS.md"]
credential_files = ["auth.json"]
sandbox_settings_file = "settings.json"
always_setup = true

[codex]
config_dir = ".codex"
files = ["auth.json", "config.toml", "AGENTS.md"]
credential_files = ["auth.json"]
always_setup = false
auto_context_file = ".codex/AGENTS.md"
api_domains = ["api.openai.com", "auth.openai.com", "chatgpt.com"]

[ollama]
config_dir = ".ollama"
files = ["id_ed25519"]
credential_files = ["id_ed25519"]
mode = "0600"

# omp keeps its user config and credentials (agent.db) in ~/.omp/agent.
# agent.db-wal is pushed after agent.db. No credential_files: omp writes
# agent.db itself as it runs, so the monitor would flag every session.
[omp]
config_dir = ".omp"
files = ["agent/config.yml", "agent/models.yml", "agent/agent.db", "agent/agent.db-wal", "agent/AGENTS.md"]
sqlite_wal_files = ["agent/agent.db"]
always_setup = true

[goose]
config_dir = ".config/goose"
files = ["config.yaml", "secrets.yaml", ".goosehints", "AGENTS.md",
         "chatgpt_codex/tokens.json", "githubcopilot/info.json",
         "gemini_oauth/tokens.json", "xai_oauth/tokens.json", "kimicode/token.json"]
credential_files = ["secrets.yaml", "chatgpt_codex/tokens.json", "githubcopilot/info.json",
                    "gemini_oauth/tokens.json", "xai_oauth/tokens.json", "kimicode/token.json"]
always_setup = false
auto_context_file = ".config/goose/.goosehints"
