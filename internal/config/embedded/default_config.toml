# Coi Default Profile — Single Source of Truth for All Defaults
# This file is embedded into the binary and parsed by GetDefaultConfig().
# All values here define the system defaults.

[container]
image = "coi-default"
# persistent is deliberately UNSET (nil pointer, defaults to false via
# BoolVal): "not configured" is distinguishable from an explicit choice, so
# resume can let session metadata win unless the user explicitly set it.
storage_pool = ""
# session_name is deliberately UNSET: when set (typically in a profile), it
# keys the session identity — container, slots, ports, saved sessions —
# instead of the workspace path, so the same persistent session continues
# from any workspace location. Trusted scope only.
# docker defaults to true so Docker-in-container works out of the box. Set
# false to drop nesting + syscall interception when Docker isn't needed —
# less shared-kernel attack surface. See also [security] reduce_kernel_surface
# and the "Threat model" wiki page.
# docker = true

[defaults]

[paths]
sessions_dir = "~/.coi/sessions"
storage_dir = "~/.coi/storage"
logs_dir = "~/.coi/logs"

[incus]
project = "default"
group = "incus-admin"
code_uid = 1000
code_user = "code"

[network]
mode = "restricted"
block_private_networks = true
block_metadata_endpoint = true
# In allowlist mode Coi resolves each hostname on the host, installs the addresses
# in the firewall, and writes the SAME addresses into the container's /etc/hosts.
# DNS egress is then blocked, so that file is the container's only way to turn a
# name into an address -- it cannot reach an address the firewall was not given.
#
# Wildcards are NOT supported: there is no answer to write for a subdomain nobody
# has asked for yet, so "*.example.com" is rejected rather than quietly
# mishandled. List exact hostnames, or the provider's published IP ranges as CIDRs
# ("142.250.0.0/15"), which need no resolution at all.
#
# There are deliberately no public resolvers here: DNS is blocked, so allowlisting
# 8.8.8.8 would buy nothing.
allowed_domains = [
    "registry.npmjs.org",
    "npm.pkg.github.com",
    "api.anthropic.com",
    "platform.claude.com",
    # Claude via GCP Vertex AI -- add your region's endpoint:
    # "us-central1-aiplatform.googleapis.com",
    # "oauth2.googleapis.com",
    # "sts.googleapis.com",
]
allow_local_network_access = false
refresh_interval_minutes = 30

[network.logging]
enabled = true
path = "~/.coi/logs/network.log"

[tool]
name = "claude"
auto_context = true
context_json = true

[git]
writable_hooks = false
# strip_attribution defaults to true: a global commit-msg hook strips auto-injected
# AI attribution (Co-Authored-By trailers / "Generated with" footers) from every
# commit. Set false to keep tool attribution. Trusted-scope only.
# strip_attribution = true
# protected_branches defaults to ["main", "master"]: root-owned git hooks refuse
# committing on, and pushing to, these branches so the agent works on feature
# branches. Set to [] to disable, or list your own. Trusted-scope only.
# protected_branches = ["main", "master"]

[ssh]
forward_agent = false

[security]
protected_paths = [".git/hooks", ".git/config", ".git/config.worktree", ".git/info/attributes", ".husky", ".vscode", ".coi", ".claude/settings.json", ".claude/settings.local.json", ".codex/config.toml"]
host_immutable = true
# writable_agent_config: when false (default), in-workspace agent tool config
# (.claude/settings.json, .claude/settings.local.json, .codex/config.toml) is
# mounted read-only so a contained agent cannot plant/modify hooks or commands
# that a later session would auto-execute.
# Set to true in trusted-scope config (~/.coi/config.toml) to let the tool write them.
# writable_agent_config = false
# reduce_kernel_surface: opt-in kernel attack-surface hardening. Disables
# Docker/nesting support (wins over [container] docker) and denies the syscall
# families behind most recent kernel escape chains (io_uring, bpf, userfaultfd,
# keyring). Node/libuv falls back off io_uring automatically. The container
# still shares the host kernel — this narrows the boundary, it does not remove
# it. Enabled by the built-in "hardened" profile. Trusted scope only.
# reduce_kernel_surface = false
# reduce_kernel_surface_strict: opt-in STRICT tier. Everything reduce_kernel_surface
# does, plus deny perf_event_open (a long-standing kernel-LPE vector). Implies
# reduce_kernel_surface. Kept separate because — unlike the base list, which has
# transparent in-container fallbacks — denying perf_event_open removes real
# capability: kernel-level profiling (perf, JVM async-profiler's perf mode) stops
# working, though it degrades gracefully (EPERM, no crash). Trusted scope only.
# reduce_kernel_surface_strict = false

[limits.cpu]
count = ""
allowance = ""
priority = 0

[limits.memory]
limit = ""
enforce = "soft"
swap = "true"

[limits.disk]
read = ""
write = ""
max = ""
priority = 0
size = ""          # whole-container rootfs quota, e.g. "20GiB"; needs a btrfs/zfs/lvm pool (rejected on a dir pool)
tmpfs_size = ""    # opt-in RAM-backed /tmp of this size (e.g. "4GiB"); "" = /tmp stays disk-backed

[limits.runtime]
max_duration = ""
max_processes = 0
auto_stop = true
stop_graceful = true

[monitoring]
enabled = false
auto_pause_on_high = true
auto_kill_on_critical = true
# Severity for interpreter one-liner reverse-shell matches (python -c, perl -e,
# ruby -e, php -r): "critical" (default, auto-kills on critical), "warn" (audit
# only, never kills), or "off" (do not flag). The unambiguous patterns (nc -e,
# /dev/tcp/, socat EXEC:, ...) always stay critical. See issue #842.
reverse_shell_one_liners = "critical"
poll_interval_sec = 2
file_read_threshold_mb = 50.0
file_read_rate_mb_per_sec = 10.0
audit_log_retention_days = 30

[monitoring.nft]
enabled = false
rate_limit_per_second = 100
dns_query_threshold = 100
log_dns_queries = true

[shell]
use_tmux = true

[timezone]
mode = "host"

[detection]
gtfobins_source = "https://github.com/GTFOBins/GTFOBins.github.io.git"
gtfobins_dir = "~/.coi/gtfobins"
sigma_source = "https://github.com/SigmaHQ/sigma.git"
sigma_dir = "~/.coi/sigma"
