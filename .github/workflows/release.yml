name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.1.0)'
        required: true

# Least privilege per job: only the release job publishes, so only it gets
# write. A workflow-level `contents: write` would also hand write access to
# the build job, which merely compiles.
permissions: {}

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The build job never pushes; don't leave the token in .git/config
          # where the uploaded artifact tooling could see it (zizmor: artipacked).
          # The release job's checkout keeps credentials — it pushes the
          # `latest` tag.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
          # No cache in the workflow that builds RELEASE binaries: a poisoned
          # Go module/build cache written by any other workflow would be baked
          # into published artifacts (zizmor: cache-poisoning).
          cache: false

      - name: Get version
        id: version
        # Dispatch input reaches the shell via env, not template expansion, so
        # its value can never be interpreted as code (zizmor: template-injection).
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=$VERSION_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies for CGo journal access
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo dpkg --add-architecture arm64
            # Restrict all existing sources to amd64 only (prevents 404s from
            # security.ubuntu.com and Azure mirrors that don't carry arm64)
            echo 'APT::Architectures:: "amd64";' | sudo tee /etc/apt/apt.conf.d/99-restrict-amd64
            # Add arm64 source from ports.ubuntu.com with explicit architecture override
            CODENAME=$(lsb_release -cs)
            printf 'Types: deb\nURIs: http://ports.ubuntu.com/ubuntu-ports\nSuites: %s %s-updates %s-security\nComponents: main universe\nArchitectures: arm64\n' "$CODENAME" "$CODENAME" "$CODENAME" | sudo tee /etc/apt/sources.list.d/arm64-ports.sources
            sudo apt-get update
            sudo apt-get install -y gcc-aarch64-linux-gnu libsystemd-dev:arm64
          else
            sudo apt-get update
            sudo apt-get install -y libsystemd-dev
          fi

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.version }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.arch == 'arm64' && 'aarch64-linux-gnu-gcc' || 'gcc' }}
          PKG_CONFIG_PATH: ${{ matrix.arch == 'arm64' && '/usr/lib/aarch64-linux-gnu/pkgconfig' || '' }}
        run: |
          # The Makefile's VERSION uses `?=`, so an env value wins and its own
          # `sed 's/^v//'` never runs. Strip the leading 'v' here to honor the
          # Makefile's bare-version contract; otherwise the binary reports
          # "vv0.10.1" and version comparison breaks (#672 follow-up).
          export VERSION="${VERSION#v}"
          make build
          mv coi coi-${{ matrix.os }}-${{ matrix.arch }}

      - name: Verify version
        # Only verify amd64 builds since ARM64 cannot run on amd64 runners
        if: matrix.arch == 'amd64'
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x coi-${{ matrix.os }}-${{ matrix.arch }}
          # Compare the FULL first line against the exact expected string. The
          # old `grep -oP 'v\K…'` matched the digits even inside "vv0.10.1",
          # so a doubled-prefix build slipped through. Anchoring the whole line
          # makes any stray 'v' (or missing one) fail the release.
          EXPECTED_VERSION=${EXPECTED_VERSION#v}
          BUILT_LINE=$(./coi-${{ matrix.os }}-${{ matrix.arch }} version | head -n1)
          EXPECTED_LINE="Coi (Code on Incus) v${EXPECTED_VERSION}"
          echo "Built version line:    $BUILT_LINE"
          echo "Expected version line: $EXPECTED_LINE"
          if [ "$BUILT_LINE" != "$EXPECTED_LINE" ]; then
            echo "ERROR: Version mismatch! Built: '$BUILT_LINE', Expected: '$EXPECTED_LINE'"
            exit 1
          fi
          echo "Version verification passed!"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coi-${{ matrix.os }}-${{ matrix.arch }}
          path: coi-${{ matrix.os }}-${{ matrix.arch }}

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist

      - name: Get version
        id: version
        # Same env indirection as the build job (zizmor: template-injection).
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=$VERSION_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release files
        run: |
          mkdir -p release
          find dist -type f -name 'coi-*' -exec mv {} release/ \;
          chmod +x release/*
          ls -lh release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum coi-* > checksums.txt
          cat checksums.txt

      - name: Create release notes
        # The heredoc stays quoted ('EOF') so the markdown backticks are never
        # shell-substituted; the version lands via a placeholder + sed from
        # env instead of template expansion (zizmor: template-injection).
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > release-notes.md << 'EOF'
          ## Installation

          ### Quick Install (Linux)
          ```bash
          # Install latest version
          curl -fsSL https://raw.githubusercontent.com/mensfeld/coi/master/install.sh | bash
          ```

          ### Manual Installation

          Download the appropriate binary for your system:

          #### Linux AMD64 (x86_64)
          ```bash
          wget https://github.com/mensfeld/coi/releases/download/__VERSION__/coi-linux-amd64
          chmod +x coi-linux-amd64
          sudo mv coi-linux-amd64 /usr/local/bin/coi
          ```

          #### Linux ARM64 (aarch64)
          ```bash
          wget https://github.com/mensfeld/coi/releases/download/__VERSION__/coi-linux-arm64
          chmod +x coi-linux-arm64
          sudo mv coi-linux-arm64 /usr/local/bin/coi
          ```

          ### Verify Installation
          ```bash
          coi version
          coi build sandbox
          coi shell
          ```

          ## What's Changed

          See [CHANGELOG.md](https://github.com/mensfeld/coi/blob/master/CHANGELOG.md) for full changes.

          ## Requirements

          - **Incus** - Linux container manager
          - **Go 1.26+** - For building from source
          - **incus-admin group** - User must be in incus-admin group

          ## Documentation

          - [README](https://github.com/mensfeld/coi/blob/master/README.md)
          - [Wiki](https://github.com/mensfeld/coi/wiki)
          - [CHANGELOG](https://github.com/mensfeld/coi/blob/master/CHANGELOG.md)
          EOF
          sed -i "s|__VERSION__|$VERSION|g" release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            release/coi-*
            release/checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -f latest
          git push -f origin latest
