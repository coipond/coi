# Agents in the CI test image (`coi build` with COI_CONFIG pointing here).
# The default set installs only OpenCode v2 (opencode2); the integration tests
# exercise both opencode tools, so v1 is added. Part of the image cache key.
#
# pi goes first on purpose: the claude installer creates ~/.local/bin, and pi's
# installer (run without a TTY) only lands on the login PATH when that exists.
# Installing pi before claude keeps the build covering pi on its own (#1035).
[container.build]
agents = ["pi", "claude", "opencode", "opencode2"]
